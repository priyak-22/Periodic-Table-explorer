{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PT Explorer</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/plogin.css' %}" />
</head>

<body>
  <!-- Background gradient -->
  <div class="bg-gradient"></div>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">

      <h1>PT Explorer</h1>
      <p class="subtitle">Sign in to continue exploring chemistry</p>

      <form method="post" autocomplete="off">
        {% csrf_token %}
        
        <div class="input-group">
          <input type="email" name="email" required autocomplete="off" />
          <label>Email</label>
        </div>

        <div class="input-group">
          <input type="password" name="password" required autocomplete="new-password" />
          <label>Password</label>
        </div>

        <button type="submit" class="login-btn">Login</button>

        {% if error %}
          <p style="color:red; margin-top:10px;">{{ error }}</p>
        {% endif %}
      </form>

      <div class="extra-links">
        <a href="{% url 'signup' %}">Create account</a>
        <span>•</span>
        <a href="#">Forgot password?</a>
      </div>

    </div>
  </div>
</body>
</html>
